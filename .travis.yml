dist: jammy
language: minimal
  # Use `nvm` to install latest version of NodeJS

# Unless we specify "sudo: false", build runs in VM, not container

# Limit the number of commits it will clone
git:
  depth: 3

# Only do CI for the default branch
branches:
  only:
  - master

before_install:
  - nvm install 22
  # ^ Install a supported version of Node for Spago
  - npm i -g npm
  # ^ Update NPM

install:
  - npm i -g purescript@0.15.4 spago@1.0.5
  - spago install

script:
  - spago test

cache:
  directories:
    - .spago
